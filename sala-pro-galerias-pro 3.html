  const mt=new THREE.Mesh(new THREE.PlaneGeometry(fw,fh),std({color:0xf7f5f0,roughness:1}));mt.position.z=.072;grp.add(mt);
  const art=new THREE.Mesh(new THREE.PlaneGeometry(w,h),std({map:paint(w,h,i),roughness:.6}));art.position.z=.075;art.userData.i=i;grp.add(art);picks.push(art);

  if(C.sp){const q=C.sp,px=s*W*C.tx,py=HT-.15,tx=s*(W/2-.1),sp=new THREE.SpotLight(q[0],q[1],q[2],q[3],q[4],1.2);sp.position.set(px,py,z);sp.target.position.set(tx,ay,z);R.add(sp,sp.target);
   const fx=new THREE.CylinderGeometry(.06,.07,.2,12);fx.rotateX(Math.PI/2);aimMesh(mk(fx,dark,px,py,z),tx,ay,z);

 }

 const ss=new THREE.SpotLight(0xfff4e6,C.sp?C.sp[1]*1.3:2.2,10,.24,.8,1.2);ss.position.set(0,HT-.15,z0);ss.target.position.set(0,1.4*sc,z0);R.add(ss,ss.target);

/* Video y arrastrar y soltar */
const vbar=$('vbar'),pp=$('pp'),sn=$('sn'),card=$('card'),plan=$('plan'),toastEl=$('toast'),fileIn=$('file');
const tc=new THREE.Color(.1,.1,.1),idleCol=new THREE.Color(.5,.5,.55),hotCol=new THREE.Color(1,.2,.35);
function toast(s){toastEl.textContent=s;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),3200)}
function sync(){if(!video)return;pp.textContent=video.paused?'Reproducir':'Pausa';sn.textContent=video.muted?'Activar sonido':'Silenciar'}
function loadVideo(f){
 if(vurl)URL.revokeObjectURL(vurl);if(video)video.pause();
 vurl=URL.createObjectURL(f);video=document.createElement('video');video.src=vurl;video.loop=true;video.playsInline=true;video.preload='auto';
 video.addEventListener('loadedmetadata',fit);['play','pause','volumechange'].forEach(e=>video.addEventListener(e,sync));
 const tex=new THREE.VideoTexture(video);tex.encoding=THREE.sRGBEncoding;tex.minFilter=tex.magFilter=THREE.LinearFilter;
 disp.material.map=tex;disp.material.needsUpdate=true;
 video.play().catch(()=>{video.muted=true;video.play().catch(()=>{})});
 vbar.classList.add('on');sync();toast('Reproduciendo: '+f.name)}
function removeVideo(){if(video)video.pause();if(vurl)URL.revokeObjectURL(vurl);video=null;vurl=null;disp.material.map=idleTex;disp.material.needsUpdate=true;fit();vbar.classList.remove('on')}
pp.onclick=()=>{if(video)video.paused?video.play():video.pause()};
sn.onclick=()=>{if(video)video.muted=!video.muted};
$('rm').onclick=removeVideo;
fileIn.onchange=()=>{const f=fileIn.files[0];fileIn.value='';if(f)loadVideo(f)};
const ray=new THREE.Raycaster();
function aim(e){ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam)}
function onScreen(e){aim(e);return ray.intersectObject(panel).length>0}
function setHot(v){if(hot===v)return;hot=v;drawIdle();bezel.material.emissive.set(v?0xd4143c:0x000000)}
addEventListener('dragenter',e=>e.preventDefault());
addEventListener('dragover',e=>{e.preventDefault();setHot(onScreen(e))});
addEventListener('dragleave',e=>{if(!e.relatedTarget)setHot(false)});
addEventListener('drop',e=>{e.preventDefault();const on=onScreen(e);setHot(false);const f=e.dataTransfer&&e.dataTransfer.files[0];if(!f)return;
 if(!f.type.startsWith('video/'))toast('Solo se admiten archivos de video');else if(!on)toast('Suéltalo directamente sobre la pantalla del fondo');else loadVideo(f)});
const sc2=document.createElement('canvas');sc2.width=sc2.height=8;const sx=sc2.getContext('2d',{willReadFrequently:true});
setInterval(()=>{if(video&&!video.paused&&video.readyState>1){try{sx.drawImage(video,0,0,8,8);const d=sx.getImageData(0,0,8,8).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}const n=d.length/4;tc.setRGB(r/n/255,g/n/255,b/n/255)}catch(e){}}},400);

sel.innerHTML=Object.keys(PLANES).map(k=>'<option value="'+k+'">'+PLANES[k].n+' · $'+PLANES[k].p+' / mes</option>').join('');
rooms.innerHTML=[0,1,2].map(n=>'<option value="'+n+'">'+(n?'+'+n+(n>1?' salas':' sala')+' (+$'+EXTRA*n+')':'Sin salas adicionales')+'</option>').join('');
function upd(){$('tot').textContent='Total: $'+(PLANES[cur].p+EXTRA*rooms.value)+' / mes'}
sel.onchange=()=>{build(sel.value);toast('Galería '+PLANES[cur].n)};rooms.onchange=upd;

$('open').onclick=openPlan;

/* Controles */
const keys={};addEventListener('keydown',e=>{if(e.target.tagName!=='SELECT')keys[e.code]=1});addEventListener('keyup',e=>keys[e.code]=0);
let jx=0,jy=0,yaw=0,pitch=0,drag=null,moved=0,vx=0,vz=0;
const joy=$('joy'),knob=$('knob');
function jmove(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-56)/48,y=(e.clientY-r.top-56)/48;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}jx=x;jy=y;knob.style.transform='translate('+x*34+'px,'+y*34+'px)'}
const jend=()=>{jx=jy=0;knob.style.transform=''};
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);jmove(e)});
joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))jmove(e)});
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.004;pitch=Math.max(-.45,Math.min(.45,pitch-dy*.003))});
addEventListener('pointerup',e=>{if(drag&&moved<6)tap(e);drag=null});

function tap(e){if(card.classList.contains('on')||plan.classList.contains('on')){card.classList.remove('on');plan.classList.remove('on');return}
 aim(e);const h=ray.intersectObjects(picks.concat([panel,disp,window.veil]))[0];if(!h)return;const o=h.object;

const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05);
 const mz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jy,mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx;
 const s=Math.sin(yaw),c=Math.cos(yaw),sp=2.8;
 vx+=((-s*mz+c*mx)*sp-vx)*dt*3;vz+=((-c*mz-s*mx)*sp-vz)*dt*3;
 cam.position.x=Math.max(-W/2+.7,Math.min(W/2-.7,cam.position.x+vx*dt));
 cam.position.z=Math.max(-L/2+1.8,Math.min(L/2-.7,cam.position.z+vz*dt));
 cam.rotation.set(pitch,yaw,0);
 knot.rotation.y+=dt*.35;knot.rotation.x+=dt*.12;
 const pl=video&&!video.paused;
 spill.color.lerp(hot?hotCol:(pl?tc:idleCol),dt*4);spill.intensity+=((hot?.9:pl?1.5:.12)-spill.intensity)*dt*3;
 fgl.material.color.copy(spill.color);fgl.material.opacity+=((hot?.5:pl?.45:0)-fgl.material.opacity)*dt*3;

}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
