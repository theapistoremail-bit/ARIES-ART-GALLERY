<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
    <title>Registro - Aries Art Gallery</title>

    <style>
        html {
            color-scheme: light;
        }

        body {
            font-family: 'Aboreto', cursive;
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
        }

        header {
            background-color: red;
            color: white;
            padding: 1em 0;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            background-color: red;
            padding: 1em 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0.3em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2em;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2em;
            border: 1px solid red;
            border-radius: 10px;
            background-color: white;
        }

        .form-container h1 {
            color: red;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5em;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5em;
            color: red;
        }

        .form-group input {
            width: 100%;
            padding: 0.5em;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            background-color: white;
            color: black;
        }

        .cta-button {
            display: inline-block;
            width: 100%;
            padding: 0.5em 2em;
            background-color: red;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        .cta-button:disabled {
            background-color: #e08080;
            cursor: not-allowed;
        }

        .mensaje {
            text-align: center;
            margin-top: 1em;
            font-family: sans-serif;
            font-size: 0.9em;
        }

        .mensaje.error { color: red; }
        .mensaje.ok { color: green; }

        footer {
            background-color: red;
            color: white;
            text-align: center;
            padding: 1em 0;
            width: 100%;
            position: relative;
        }
    </style>
</head>

<body>

<header>
    <h1>Aries Art Gallery</h1>
</header>

<nav>
    <a href="INICIO.html">Inicio</a>
    <a href="registro.html">Registrarse</a>
    <a href="iniciar.html">Iniciar Sesión</a>
    <a href="galeria.html">Galería</a>
    <a href="contacto.html">Contacto</a>
    <a href="EVENTOS.HTML">Eventos</a>
    <a href="TIENDA.html">Tienda</a>
    <a href="Noticias.html">Noticias</a>
    <a href="subs.html">Planes</a>
</nav>

<div class="container">
    <div class="form-container">
        <h1>Registro de Usuario</h1>

        <form id="formRegistro">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required minlength="6">
            </div>

            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <input type="password" id="confirm-password" required minlength="6">
            </div>

            <button class="cta-button" id="btnRegistro" type="submit">Registrarse</button>
            <p id="mensaje" class="mensaje"></p>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2024 Aries Art Gallery. Todos los derechos reservados.</p>
</footer>

<!-- SDK de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // --- Conexión a Supabase ---
    const SUPABASE_URL = "https://ervucqpuhttdztiikelw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_b4thpt6kZH9dInOnp1ii0w_Up1xO43t";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("formRegistro");
    const btn = document.getElementById("btnRegistro");
    const mensaje = document.getElementById("mensaje");

    function mostrarMensaje(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = "mensaje " + tipo;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        mostrarMensaje("", "");

        const nombre = document.getElementById("nombre").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm-password").value;

        if (password !== confirm) {
            mostrarMensaje("Las contraseñas no coinciden.", "error");
            return;
        }

        btn.disabled = true;
        btn.textContent = "Registrando...";

        // Crea la cuenta en Supabase Auth y guarda el nombre como metadata del usuario
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    nombre: nombre
                }
            }
        });

        btn.disabled = false;
        btn.textContent = "Registrarse";

        if (error) {
            mostrarMensaje("Error: " + error.message, "error");
            return;
        }

        // Crea también el perfil público (plan, biografía) usado por galeria.html
        if (data.user) {
            await supabaseClient.from("perfiles").upsert({
                id: data.user.id,
                nombre: nombre,
                plan: "free"
            });
        }

        mostrarMensaje("¡Cuenta creada! Revisa tu correo para confirmar.", "ok");
        form.reset();

        // Redirige a iniciar sesión después de 2 segundos
        setTimeout(() => {
            window.location.href = "iniciar.html";
        }, 2000);
    });
</script>

</body>
</html>
