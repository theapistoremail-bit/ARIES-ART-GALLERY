<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complejo de galerías</title>
<link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#d4143c;--ink:#16161a;--glass:rgba(255,255,255,.82)}

#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 4px 14px rgba(0,0,0,.4)}

#vbar.on{transform:translate(-50%,0)}
#vbar button{border:0;background:transparent;font:500 14px 'Jost',sans-serif;padding:10px 14px;border-radius:22px;color:var(--ink)}
#vbar #rm{color:var(--red)}
#toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;pointer-events:none;padding:10px 18px;border-radius:22px;font-size:14px;transition:all .35s ease;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:22px 24px;border-radius:22px;transform:translateY(130%);transition:transform .5s ease}
.sheet.on{transform:none}
.sheet h2{margin:0 0 2px;font:400 22px 'Aboreto',serif;letter-spacing:.06em}
.sheet em{display:block;margin-bottom:10px;font-style:normal;font-size:14px;color:var(--red)}
.sheet p{margin:0 0 12px;font-size:15px;line-height:1.5;opacity:.85}
.sheet label{display:block;margin-bottom:12px;font-size:13px;letter-spacing:.06em;opacity:.8}
.sheet select{display:block;width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid rgba(0,0,0,.15);background:#fff;font:500 16px 'Jost',sans-serif;color:var(--ink)}
#tot{font:400 20px 'Aboreto',serif;letter-spacing:.05em;margin:4px 0 14px}
#join{width:100%;border:0;background:var(--red);color:#fff;font:500 16px 'Jost',sans-serif;padding:14px;border-radius:14px;box-shadow:0 8px 24px rgba(212,20,60,.4)}
#start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:#0b0b0d;color:#f4f4f2;transition:opacity 1s ease}

#start h1{margin:0;font:400 clamp(32px,9vw,56px) 'Aboreto',serif;letter-spacing:.12em}
#start p{margin:0;max-width:40ch;font-size:16px;line-height:1.65;opacity:.75}
#start button{margin-top:8px;border:0;background:var(--red);color:#fff;font:500 17px 'Jost',sans-serif;padding:14px 36px;border-radius:30px;box-shadow:0 8px 28px rgba(212,20,60,.5)}

</style>
</head>
<body>
<div id="chip" class="g"></div>
<button id="open" type="button">Elegir salas</button>
<div id="joy"><div id="knob"></div></div>
<div id="vbar" class="g"><button id="pp" type="button">Pausa</button><button id="sn" type="button">Silenciar</button><button id="rm" type="button">Quitar video</button></div>
<div id="toast" class="g"></div>
<div id="card" class="sheet g"></div>
<div id="plan" class="sheet g">
  <h2>Plan Pro</h2><em>Elige cuántas salas</em>
  <label>Salas en tu galería<select id="sel"></select></label>
  <p id="pd"></p>
  <div id="tot"></div>
  <button id="join" type="button">Unirme al plan Pro</button>
</div>
<input id="file" type="file" accept="video/*" hidden>
<div id="start">
  <h1>Complejo de galerías</h1>
  <p>Hasta cinco salas conectadas, cada una con su propia iluminación. Camina con el joystick o WASD, arrastra para mirar y cruza las puertas. Para reproducir un video, suéltalo directamente sobre la pantalla de la última sala.</p>
  <button id="go" type="button">Entrar</button>
</div>

  if(a.src)new THREE.TextureLoader().load(a.src,tx=>{tx.encoding=THREE.sRGBEncoding;fitCover(tx,w,h);art.material.map=tx;art.material.needsUpdate=true});
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(.46,.17),new THREE.MeshBasicMaterial({map:plac(ti)}));pl.position.set(fw/2-.2,-fh/2-.2,.012);grp.add(pl);
  if(t.sp){const px=s*W*t.tx,py=H-.15,tx=s*(W/2-.1);r.lt[j]={pos:[px,py,z],tgt:[tx,ay,z]};
   const fx=new THREE.CylinderGeometry(.06,.07,.2,12);fx.rotateX(Math.PI/2);mk(fx,dark,px,py,z).lookAt(tx,ay,z);
   if(t.beam){const d=Math.hypot(tx-px,ay-py),cg=new THREE.ConeGeometry(d*Math.tan(t.sp[3])*.9,d,24,1,true);cg.translate(0,-d/2,0);cg.rotateX(-Math.PI/2);

  const c=gcan(440,620),x=c.getContext('2d');x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,0,440,620);x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=3;x.strokeRect(6,6,428,608);

function build(n){
 NR=n;window.veil=null;if(R){scene.remove(R);R.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
 R=new THREE.Group();scene.add(R);picks.length=0;knots=[];RM=[];TT=[];AI=0;
 let z=0;for(let i=0;i<n;i++){const t=TH[i];RM.push({t,zc:z-t.L/2,lt:[]});z-=t.L}TOT=-z;
 RM.forEach((r,i)=>buildRoom(i));
 const r=RM[n-1],t=r.t,sy=t.H*.5,zs=r.zc-t.L/2;PW=Math.round(t.W*4.6)/10;PH=PW*9/16;
 bezel.geometry=new THREE.BoxGeometry(PW+.3,PH+.3,.14);bezel.position.set(0,sy,zs+.07);

}

/* Video, arrastrar y soltar */
const vbar=$('vbar'),pp=$('pp'),sn=$('sn'),card=$('card'),plan=$('plan'),toastEl=$('toast'),fileIn=$('file'),sel=$('sel');
const tc=new THREE.Color(.1,.1,.1),idleCol=new THREE.Color(.5,.5,.55),hotCol=new THREE.Color(1,.2,.35);

function sync(){if(!video)return;pp.textContent=video.paused?'Reproducir':'Pausa';sn.textContent=video.muted?'Activar sonido':'Silenciar'}
function loadVideo(f){
 if(vurl)URL.revokeObjectURL(vurl);if(video)video.pause();
 vurl=URL.createObjectURL(f);video=document.createElement('video');video.src=vurl;video.loop=true;video.playsInline=true;video.preload='auto';
 video.addEventListener('loadedmetadata',fit);['play','pause','volumechange'].forEach(e=>video.addEventListener(e,sync));
 const tex=new THREE.VideoTexture(video);tex.encoding=THREE.sRGBEncoding;tex.minFilter=tex.magFilter=THREE.LinearFilter;

function removeVideo(){if(video)video.pause();if(vurl)URL.revokeObjectURL(vurl);video=null;vurl=null;disp.material.map=idleTex;disp.material.needsUpdate=true;fit();vbar.classList.remove('on')}
pp.onclick=()=>{if(video)video.paused?video.play():video.pause()};

const ray=new THREE.Raycaster();

/* Menú: cuántas salas */
sel.innerHTML=[1,2,3,4,5].map(n=>'<option value="'+n+'">'+n+(n>1?' salas':' sala')+' · $'+(BASE+EXTRA*(n-1))+' / mes</option>').join('');

const joy=$('joy'),knob=$('knob');
function jmove(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-56)/48,y=(e.clientY-r.top-56)/48;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}jx=x;jy=y;knob.style.transform='translate('+x*34+'px,'+y*34+'px)'}
const jend=()=>{jx=jy=0;knob.style.transform=''};

cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.004;pitch=Math.max(-.45,Math.min(.45,pitch-dy*.003))});

 aim(e);const h=ray.intersectObjects(picks.concat([panel,disp,window.veil].filter(Boolean)))[0];if(!h)return;const o=h.object;

 SP.forEach(sl=>{const u=sl.userData;if(u.pend){sl.intensity+=(0-sl.intensity)*Math.min(1,dt*8);if(sl.intensity<.05){const p=u.pend;if(p.pos){sl.position.set(p.pos[0],p.pos[1],p.pos[2]);sl.target.position.set(p.tgt[0],p.tgt[1],p.tgt[2]);sl.color.setHex(p.col);sl.distance=p.dist;sl.angle=p.ang;sl.penumbra=p.pen}u.t=p.int||0;u.pend=null}}else sl.intensity+=(u.t-sl.intensity)*Math.min(1,dt*4)});

}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
(async()=>{(await cargarCuadros('complejo')).forEach((u,i)=>{if(ART[i]&&u)ART[i].src=u});
const h0=parseInt((location.hash||'').slice(1));build(h0>=1&&h0<=5?h0:5);
loop();})();
