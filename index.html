<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
    <title>Iniciar Sesión - Aries Art Gallery</title>
    <style>
        body {
            font-family: 'Aboreto', cursive;
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
        }
        header {
            background-color: red;
            color: white;
            padding: 1em 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background-color: red;
            padding: 1em 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2em;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2em;
            border: 1px solid red;
            border-radius: 10px;
            background-color: white;
        }
        .form-container h1 {
            color: red;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5em;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5em;
            color: red;
        }
        .form-group input {
            width: 100%;
            padding: 0.5em;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .cta-button {
            display: inline-block;
            width: 100%;
            padding: 0.5em 2em;
            background-color: red;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
        }
        footer {
            background-color: red;
            color: white;
            text-align: center;
            padding: 1em 0;
            position: absolute;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Aries Art Gallery</h1>
    </header>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#registro">Registrarse</a>
        <a href="#login">Iniciar Sesión</a>
        <a href="#galeria">Galería</a>
        <a href="#contacto">Contacto</a>
    </nav>
    <div class="container">
        <div class="form-container">
            <h1>Iniciar Sesión</h1>
            <form action="tu_url_de_login" method="post">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="cta-button">Iniciar Sesión</button>
                </div>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2024 Aries Art Gallery. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
