<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
    <title>Aries Art Gallery</title>
    <style>
        body {
            font-family: 'Aboreto', cursive;
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
        }
        header {
            background-color: red;
            color: white;
            padding: 1em 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background-color: red;
            padding: 1em 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .slideshow-container {
            position: relative;
            max-width: 800px;
            margin: 2em auto;
            overflow: hidden;
            border: 4px solid black;
            border-radius: 10px;
        }
        .slides {
            display: none;
            width: 100%;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            background-color: #000;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .dot-container {
            text-align: center;
            padding: 10px;
        }
        .dot {
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }
        .active {
            background-color: #717171;
        }
        footer {
            background-color: red;
            color: white;
            text-align: center;
            padding: 1em 0;
            width: 100%;
            bottom: 0;
        }
    </style>
    <script>
        let slideIndex = 0;

        function showSlides() {
            const slides = document.getElementsByClassName("slides");
            const dots = document.getElementsByClassName("dot");
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1; }    
            slides[slideIndex - 1].style.display = "block";  
            dots[slideIndex - 1].className += " active";
            setTimeout(showSlides, 3000); // Cambia cada 3 segundos
        }

        document.addEventListener("DOMContentLoaded", showSlides);
    </script>
</head>
<body>
    <header>
        <h1>Aries Art Gallery</h1>
    </header>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#registro">Registrarse</a>
        <a href="#login">Iniciar Sesión</a>
        <a href="#galeria">Galería</a>
        <a href="#contacto">Contacto</a>
    </nav>
    <div class="slideshow-container">
        <div class="slides">
            <div class="iframe-container">
                <iframe src="https://example.com/3d-environment1" allowfullscreen></iframe>
            </div>
        </div>
        <div class="slides">
            <div class="iframe-container">
                <iframe src="https://example.com/3d-environment2" allowfullscreen></iframe>
            </div>
        </div>
        <div class="slides">
            <div class="iframe-container">
                <iframe src="https://example.com/3d-environment3" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    <div class="dot-container">
        <span class="dot"></span> 
        <span class="dot"></span> 
        <span class="dot"></span> 
    </div>
    <footer>
        <p>&copy; 2024 Aries Art Gallery. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
