<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
    <title>Aries Art Gallery</title>
    <style>
        body {
            font-family: 'Aboreto', Georgia, serif;
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: red;
            color: white;
            padding: 1em 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background-color: red;
            padding: 1em 0;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        main { flex: 1; }
        .slideshow-container {
            position: relative;
            max-width: 800px;
            margin: 2em auto;
            overflow: hidden;
            border: 4px solid black;
            border-radius: 10px;
        }
        .slides { display: none; width: 100%; }
        .slides.is-active { display: block; }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background-color: #000;
        }
        .iframe-container iframe,
        .iframe-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .dot-container { text-align: center; padding: 10px; }
        .dot {
            height: 15px;
            width: 15px;
            margin: 0 2px;
            padding: 0;
            border: 0;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: background-color 0.6s ease;
        }
        .dot.active { background-color: #717171; }
        .entrar-box { text-align: center; margin: 0 0 2em; }
        .entrar {
            display: inline-block;
            padding: 0.7em 2em;
            background-color: red;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
        .entrar:hover, .entrar:focus-visible { background-color: darkred; }
        footer {
            background-color: red;
            color: white;
            text-align: center;
            padding: 1em 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header id="inicio">
        <h1>Aries Art Gallery</h1>
    </header>
    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#registro">Registrarse</a>
        <a href="#login">Iniciar Sesión</a>
        <a href="#galeria">Galería</a>
        <a href="#contacto">Contacto</a>
    </nav>
    <main>
        <div class="slideshow-container" id="galeria">
            <div class="slides">
                <div class="iframe-container">
                    <iframe id="visor" title="Aries Art Gallery" allow="fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
                </div>
            </div>
            <div class="slides">
                <div class="iframe-container">
                    <video src="videos/video2.mp4" controls playsinline preload="metadata" title="Aries Art Gallery 2"></video>
                </div>
            </div>
            <div class="slides">
                <div class="iframe-container">
                    <video src="videos/video3.mp4" controls playsinline preload="metadata" title="Aries Art Gallery 3"></video>
                </div>
            </div>
        </div>
        <div class="dot-container" id="dots"></div>
        <p class="entrar-box"><a id="entrar" class="entrar" href="#" target="_blank" rel="noopener noreferrer">Entrar a la galería</a></p>
    </main>
    <footer>
        <p>&copy; 2024 Aries Art Gallery. Todos los derechos reservados.</p>
    </footer>

    <script>
        (function () {
            // Cambia aquí el enlace de tu galería: lo usan el visor y el botón.
            const GALERIA_URL = "<iframe width="970" height="600" src="https://www.viverse.com/MvmFPs6?full3d=&no-cookie=" title="Aries Art Gallery And Store " frameborder="0" allowfullscreen></iframe>";
            document.getElementById("visor").src = GALERIA_URL + "?full3d=&no-cookie=";
            document.getElementById("entrar").href = GALERIA_URL;

            const slides = document.querySelectorAll(".slides");
            const dotsBox = document.getElementById("dots");
            const dots = Array.from(slides).map(function (_, i) {
                const d = document.createElement("button");
                d.type = "button";
                d.className = "dot";
                d.setAttribute("aria-label", "Ir a la vista " + (i + 1));
                d.addEventListener("click", function () { show(i); });
                dotsBox.appendChild(d);
                return d;
            });
            function show(n) {
                document.querySelectorAll(".slides video").forEach(function (v) { v.pause(); });
                slides.forEach(function (s, i) {
                    s.classList.toggle("is-active", i === n);
                    dots[i].classList.toggle("active", i === n);
                });
            }
            show(0);
        })();
    </script>
</body>
</html>
