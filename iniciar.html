<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
    
    <title>Iniciar Sesión - Aries Art Gallery</title>

    <style>
        body {
            font-family: 'Aboreto', cursive;
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
        }

        header {
            background-color: red;
            color: white;
            padding: 1em 0;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap; /* FIX ruptura */
            background-color: red;
            padding: 1em 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0.3em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2em;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2em;
            border: 1px solid red;
            border-radius: 10px;
            background-color: white;
        }

        .form-container h1 {
            color: red;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5em;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5em;
            color: red;
        }

        .form-group input {
            width: 100%;
            padding: 0.5em;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .cta-button {
            display: inline-block;
            width: 100%;
            padding: 0.5em 2em;
            background-color: red;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        footer {
            background-color: red;
            color: white;
            text-align: center;
            padding: 1em 0;
            width: 100%;
            position: relative; /* FIX footer */
        }
    </style>
</head>

<body>

<header>
    <h1>Aries Art Gallery</h1>
</header>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Registrarse</a>
    <a href="#">Iniciar Sesión</a>
    <a href="#">Galería</a>
    <a href="#">Contacto</a>
    <a href="#">Eventos</a>
    <a href="#">Tienda</a>
    <a href="#">Noticias</a>
    <a href="#">Planes</a>
</nav>

<div class="container">
    <div class="form-container">
        <h1>Iniciar Sesión</h1>

        <form id="loginForm">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required>
            </div>

            <div class="form-group">
                <button type="submit" class="cta-button">Iniciar Sesión</button>
            </div>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2024 Aries Art Gallery. Todos los derechos reservados.</p>
</footer>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const SUPABASE_URL = "TU_URL";
const SUPABASE_KEY = "TU_ANON_KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        alert(error.message);
        return;
    }

    // 🔥 REDIRECCIÓN AL PANEL
    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
