<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
<title>Iniciar Sesión - Aries Art Gallery</title>
<style>
  body{font-family:'Aboreto',cursive;margin:0;background:#fff;color:#000;min-height:100vh;display:flex;flex-direction:column}
  header,nav,footer{background:red;color:#fff;text-align:center}
  header{padding:1em 0}
  nav{display:flex;justify-content:space-around;flex-wrap:wrap;padding:1em 0}
  nav a{color:#fff;text-decoration:none;font-weight:bold;padding:5px 10px}
  .container{max-width:1200px;margin:0 auto;padding:2em;flex:1;width:100%;box-sizing:border-box}
  .form-container{max-width:500px;margin:0 auto;padding:2em;border:1px solid red;border-radius:10px}
  .form-container h1{color:red;text-align:center}
  .form-group{margin-bottom:1.5em}
  .form-group label{display:block;margin-bottom:.5em;color:red}
  .form-group input{width:100%;padding:.5em;border:1px solid #ccc;border-radius:5px;box-sizing:border-box;font-size:16px}
  .cta-button{width:100%;padding:.6em 2em;background:red;color:#fff;font-family:inherit;font-weight:bold;border:0;border-radius:5px;cursor:pointer;font-size:1em}
  .cta-button.alt{background:#fff;color:red;border:1px solid red;margin-top:.7em}
  #msg{min-height:1.4em;text-align:center;color:red}
  footer{padding:1em 0}
</style>
</head>
<body>
<header><h1>Aries Art Gallery</h1></header>
<nav>
  <a href="index.html">Inicio</a>
  <a href="registro.html">Registrarse</a>
  <a href="iniciar.html">Iniciar Sesión</a>
  <a href="galeria.html">Galería</a>
  <a href="contacto.html">Contacto</a>
  <a href="EVENTOS.HTML">Eventos</a>
  <a href="tienda.html">Tienda</a>
  <a href="news.html">Noticias</a>
  <a href="subs.html">Planes</a>
  <a href="dashboard.html">Mi panel</a>
</nav>
<div class="container">
  <div class="form-container">
    <h1>Iniciar Sesión</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required minlength="6" autocomplete="current-password">
      </div>
      <p id="msg" role="alert"></p>
      <button type="submit" class="cta-button">Entrar a la galería</button>
      <button type="button" id="signup" class="cta-button alt">Crear cuenta</button>
    </form>
  </div>
</div>
<footer><p>&copy; 2026 Aries Art Gallery. Todos los derechos reservados.</p></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Pega aquí los datos de Supabase > Project Settings > API
  const SUPABASE_URL = 'https://ervucqpuhttdztiikelw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_b4thpt6kZH9dInOnp1ii0w_Up1xO43t';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const msg = document.getElementById('msg');
  const creds = () => ({ email: email.value.trim(), password: password.value });

  sb.auth.getSession().then(({ data }) => { if (data.session) location.href = 'dashboard.html'; });

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault(); msg.textContent = '';
    const { error } = await sb.auth.signInWithPassword(creds());
    if (error) msg.textContent = 'Correo o contraseña incorrectos.';
    else location.href = 'dashboard.html';
  });

  // El registro con rol (artista / comprador) vive en registro.html
  document.getElementById('signup').addEventListener('click', () => { location.href = 'registro.html'; });
</script>
</body>
</html>
