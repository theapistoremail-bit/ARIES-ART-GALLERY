<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Galería - Aries Art Gallery</title>

    <style>
        html { color-scheme: light; }
        * { box-sizing: border-box; }

        :root {
            --ink: #16161a;
            --ink-soft: #6b6b70;
            --line: #e7e7ea;
            --accent: #C0142C;
            --accent-dark: #7a0f1f;
            --accent-soft: #fbe9eb;
            --font-display: 'Playfair Display', serif;
            --font-body: 'Inter', sans-serif;
            --radius: 10px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.04);
        }

        body {
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: var(--ink);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1em 2em;
            border-bottom: 1px solid var(--line);
            border-top: 4px solid var(--accent);
            flex-wrap: wrap;
        }

        .marca {
            font-family: var(--font-display);
            font-size: 1.3em;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
        }

        .topbar nav {
            display: flex;
            gap: 1.2em;
            flex-wrap: wrap;
        }

        .topbar nav a {
            color: var(--ink-soft);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
        }

        .topbar nav a:hover { color: var(--accent); }

        .hero {
            text-align: center;
            padding: 3em 1.5em 2em 1.5em;
        }

        .hero h1 {
            font-family: var(--font-display);
            font-size: 2.2em;
            margin: 0 0 0.3em 0;
        }

        .hero p {
            color: var(--ink-soft);
            max-width: 500px;
            margin: 0 auto;
        }

        .contenedor {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1em 2em 4em 2em;
        }

        .artista-bloque {
            border-top: 1px solid var(--line);
            padding: 2.5em 0;
        }

        .artista-cabecera {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1em;
            margin-bottom: 1.3em;
        }

        .artista-cabecera h2 {
            font-family: var(--font-display);
            margin: 0 0 0.3em 0;
            font-size: 1.4em;
        }

        .artista-bio {
            color: var(--ink-soft);
            font-size: 0.92em;
            max-width: 600px;
            line-height: 1.5;
        }

        .plan-tag {
            display: inline-block;
            padding: 0.25em 0.8em;
            border-radius: 20px;
            font-size: 0.72em;
            font-weight: 700;
            background: var(--accent-soft);
            color: var(--accent-dark);
            white-space: nowrap;
        }

        .obras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .obra-card {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            background: white;
            box-shadow: var(--shadow);
        }

        .obra-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .obra-info { padding: 0.8em; }
        .obra-info h3 { margin: 0 0 0.3em 0; font-size: 0.95em; }
        .obra-info p { margin: 0.2em 0; font-size: 0.83em; color: var(--ink-soft); }
        .obra-info .precio { color: var(--accent); font-weight: 700; }

        .estado {
            text-align: center;
            padding: 4em 1em;
            color: var(--ink-soft);
        }

        footer {
            background-color: white;
            color: var(--ink-soft);
            text-align: center;
            padding: 1.5em 0;
            width: 100%;
            border-top: 1px solid var(--line);
            font-size: 0.85em;
        }
    </style>
</head>

<body>

<div class="topbar">
    <a href="INICIO.html" class="marca">Aries Art Gallery</a>
    <nav>
        <a href="INICIO.html">Inicio</a>
        <a href="registro.html">Registrarse</a>
        <a href="iniciar.html">Iniciar Sesión</a>
        <a href="galeria.html">Galería</a>
        <a href="subs.html">Planes</a>
    </nav>
</div>

<div class="hero">
    <h1>Galería de Artistas</h1>
    <p>Descubre obras originales de artistas independientes de todo el mundo.</p>
</div>

<div class="contenedor" id="contenedor">
    <p class="estado" id="estadoCarga">Cargando galería...</p>
</div>

<footer>
    <p>&copy; 2024 Aries Art Gallery. Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://ervucqpuhttdztiikelw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_b4thpt6kZH9dInOnp1ii0w_Up1xO43t";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const LIMITES_PLAN = { free: 5, premium: 10, vip: 100 };
    const NOMBRES_PLAN = { free: "Gratuito", premium: "Premium", vip: "VIP" };

    const contenedor = document.getElementById("contenedor");
    const estadoCarga = document.getElementById("estadoCarga");

    async function cargarGaleria() {
        const { data: perfiles, error: errorPerfiles } = await supabaseClient
            .from("perfiles")
            .select("*");

        if (errorPerfiles) {
            estadoCarga.textContent = "No se pudo cargar la galería. Intenta de nuevo más tarde.";
            console.error(errorPerfiles);
            return;
        }

        if (!perfiles || perfiles.length === 0) {
            estadoCarga.textContent = "Todavía no hay artistas registrados.";
            return;
        }

        contenedor.innerHTML = "";
        let huboContenido = false;

        for (const perfil of perfiles) {
            const limite = LIMITES_PLAN[perfil.plan] || 5;

            const { data: obras, error: errorObras } = await supabaseClient
                .from("obras")
                .select("*")
                .eq("user_id", perfil.id)
                .order("created_at", { ascending: false })
                .limit(limite);

            if (errorObras || !obras || obras.length === 0) continue;

            huboContenido = true;

            const bloque = document.createElement("div");
            bloque.className = "artista-bloque";

            const tarjetas = obras.map(obra => `
                <div class="obra-card">
                    <img src="${obra.imagen_url}" alt="${obra.titulo}">
                    <div class="obra-info">
                        <h3>${obra.titulo}</h3>
                        <p>${obra.descripcion || ""}</p>
                        ${obra.precio ? `<p class="precio">$${obra.precio}</p>` : ""}
                    </div>
                </div>
            `).join("");

            bloque.innerHTML = `
                <div class="artista-cabecera">
                    <div>
                        <h2>${perfil.nombre || "Artista"}</h2>
                        <p class="artista-bio">${perfil.bio || ""}</p>
                    </div>
                    <span class="plan-tag">${NOMBRES_PLAN[perfil.plan] || "Gratuito"}</span>
                </div>
                <div class="obras-grid">${tarjetas}</div>
            `;

            contenedor.appendChild(bloque);
        }

        if (!huboContenido) {
            contenedor.innerHTML = '<p class="estado">Todavía no hay obras publicadas.</p>';
        }
    }

    cargarGaleria();
</script>

</body>
</html>
